
name: Backend CI/CD

on:
  push:
    branches:
      - aphsmsp-stg
  pull_request:
    branches:
      - aphsmsp-stg

permissions:
  contents: read

concurrency:
  group: backend-stg-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: 8082
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: school_management
      DB_SSL: "false"
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1h
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET: test-bucket

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: node ./node_modules/typeorm/cli.js migration:run -d dist/data-source.js
      - run: npm run test:e2e

  build:
    name: Build and publish backend
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Define image tag
        id: meta
        shell: bash
        run: |
          REPO="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend stack
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Sync deployment configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STG_EC2_HOST }}
          username: ${{ secrets.STG_EC2_SSH_USER }}
          key: ${{ secrets.STG_EC2_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/nginx.conf"
          target: "/opt/sms"
          strip_components: 1

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_READ_TOKEN: ${{ secrets.STG_GHCR_READ_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build.outputs.image }}
          DB_USERNAME: ${{ secrets.STG_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.STG_DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.STG_DB_DATABASE }}
          JWT_SECRET: ${{ secrets.STG_JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.STG_JWT_EXPIRES_IN }}
          SMTP_HOST: ${{ secrets.STG_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.STG_SMTP_PORT }}
          SMTP_USER: ${{ secrets.STG_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.STG_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.STG_SMTP_FROM }}
          RUSTFS_ACCESS_KEY: ${{ secrets.STG_RUSTFS_ACCESS_KEY }}
          RUSTFS_SECRET_KEY: ${{ secrets.STG_RUSTFS_SECRET_KEY }}

        with:
          host: ${{ secrets.STG_EC2_HOST }}
          username: ${{ secrets.STG_EC2_SSH_USER }}
          key: ${{ secrets.STG_EC2_SSH_KEY }}
          envs: GHCR_READ_TOKEN,GHCR_ACTOR,IMAGE,DB_USERNAME,DB_PASSWORD,DB_DATABASE,JWT_SECRET,JWT_EXPIRES_IN,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,SMTP_FROM,RUSTFS_ACCESS_KEY,RUSTFS_SECRET_KEY
          script: |
            set -eu
            cd /opt/sms

            test -n "$GHCR_READ_TOKEN"
            test -n "$IMAGE"
            test -n "$RUSTFS_ACCESS_KEY"
            test -n "$RUSTFS_SECRET_KEY"

            umask 077
            cat > .env <<EOF
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            DB_DATABASE=$DB_DATABASE
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRES_IN=$JWT_EXPIRES_IN
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_USER=$SMTP_USER
            SMTP_PASSWORD=$SMTP_PASSWORD
            SMTP_FROM=$SMTP_FROM
            RUSTFS_ACCESS_KEY=$RUSTFS_ACCESS_KEY
            RUSTFS_SECRET_KEY=$RUSTFS_SECRET_KEY
            STORAGE_BUCKET=sms-uploads
            STORAGE_PUBLIC_URL_BASE=
            EOF
            chmod 600 .env

            echo "$GHCR_READ_TOKEN" | docker login ghcr.io \
              -u "$GHCR_ACTOR" --password-stdin

            export BACKEND_IMAGE="$IMAGE"

            docker compose config --quiet
            docker compose pull postgres rustfs backend nginx

            docker compose up -d --wait postgres rustfs

            docker compose run --rm --no-deps backend \
              node ./node_modules/typeorm/cli.js \
              migration:run -d dist/data-source.js

            docker compose up -d --wait backend nginx

            docker compose ps
            printf '%s\n' "$IMAGE" > .deployed-backend-image
            chmod 600 .deployed-backend-image
