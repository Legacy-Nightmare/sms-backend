# Single entry point for frontend, backend and RustFS.
# HTTP only; configure HTTPS after attaching a domain.

server {
    listen 80;
    server_name _;

    client_max_body_size 15m;

    # Backend API
    # Removes /api/ prefix before forwarding to NestJS.
    location /api/ {
        proxy_pass http://backend:8082/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ZKTeco biometric device endpoints
    location /iclock/ {
        proxy_pass http://backend:8082/iclock/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI and API documentation
    location /docs {
        proxy_pass http://backend:8082/docs;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy uploads served by the backend
    location /uploads/ {
        proxy_pass http://backend:8082/uploads/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # RustFS S3-compatible object storage
    # NOTE: Public object access also requires correct bucket policy.
    location /storage/ {
        proxy_pass http://rustfs:9000/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (TanStack Start)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}