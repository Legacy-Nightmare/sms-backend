# Single entry point on :80 for both apps — no domain yet, so plain HTTP
# against the EC2 IP. Add a server_name + certbot/TLS block here once a
# domain exists; everything else (routing) carries over unchanged to the VPS.

server {
    listen 80;
    server_name _;
    client_max_body_size 15m;

    # NestJS backend is mounted at the root of its own container (no /api
    # prefix in its routes) — strip /api here so the frontend can call a
    # same-origin, relative "/api/..." base URL with zero CORS config.
    location /api/ {
        proxy_pass http://backend:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ZKTeco biometric device endpoints (raw wire protocol, not JSON) — the
    # device is configured to push directly to this path, no /api prefix.
    location /iclock/ {
        proxy_pass http://backend:8082/iclock/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger UI + its JSON spec.
    location /docs {
        proxy_pass http://backend:8082/docs;
        proxy_set_header Host $host;
    }

    # Legacy local-disk student photo uploads predating Supabase Storage.
    location /uploads/ {
        proxy_pass http://backend:8082/uploads/;
    }

    # Staging's MinIO stand-in for Supabase Storage (see StorageService) —
    # public object reads only. "/storage/<bucket>/<key>" strips to
    # "/<bucket>/<key>" at MinIO, matching its plain S3 path-style URLs.
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
    }

    # Everything else -> the TanStack Start SSR frontend.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
