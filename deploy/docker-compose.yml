
services:
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - sms_pgdata:/var/lib/postgresql/data
    networks:
      - sms
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: sms-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    command: /data
    volumes:
      - sms_rustfs_data:/data
    networks:
      - sms
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  storage-init:
    image: amazon/aws-cli:2
    container_name: sms-storage-init
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: us-east-1
      STORAGE_BUCKET: ${STORAGE_BUCKET:-sms-uploads}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$STORAGE_BUCKET" >/dev/null 2>&1; do
          if aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$STORAGE_BUCKET"; then
            break
          fi
          sleep 3
        done
        echo "Storage bucket is ready."
    networks:
      - sms

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/legacy-nightmare/sms-backend:stg}
    container_name: sms-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSL: "false"
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${STORAGE_BUCKET:-sms-uploads}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      STORAGE_PUBLIC_URL_BASE: ${STORAGE_PUBLIC_URL_BASE:-}
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - sms_uploads:/app/uploads
    networks:
      - sms

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/legacy-nightmare/sms-frontend:stg}
    container_name: sms-frontend
    restart: unless-stopped
    networks:
      - sms

  nginx:
    image: nginx:1.27-alpine
    container_name: sms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - rustfs
    networks:
      - sms

networks:
  sms:

volumes:
  sms_pgdata:
  sms_uploads:
  sms_rustfs_data:
