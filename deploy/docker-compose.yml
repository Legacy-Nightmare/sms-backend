
services:
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: sms-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
    volumes:
      - rustfs_data:/data
    networks:
      - sms
    # Internal S3 API; not exposed directly to the internet.
    # RustFS console port 9001 is also not publicly exposed.

  rustfs-init:
    image: minio/mc:latest
    container_name: sms-rustfs-init
    depends_on:
      - rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"; do
          echo "Waiting for RustFS..."
          sleep 3
        done
        mc mb --ignore-existing local/sms-uploads
        echo "Bucket sms-uploads is ready."
    restart: "no"
    networks:
      - sms

  backend:
    image: ghcr.io/legacy-nightmare/sms-backend:${IMAGE:?IMAGE is required}
    container_name: sms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "8082"
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      S3_BUCKET: ${STORAGE_BUCKET:-sms-uploads}
      STORAGE_PUBLIC_URL_BASE: ${STORAGE_PUBLIC_URL_BASE:-}
    expose:
      - "8082"
    networks:
      - sms

  frontend:
    image: ghcr.io/legacy-nightmare/sms-frontend:${FRONTEND_IMAGE_TAG:-stg}
    container_name: sms-frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - sms

  nginx:
    image: nginx:alpine
    container_name: sms-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - rustfs
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sms

networks:
  sms:
    driver: bridge

volumes:
  pgdata:
    name: sms_pgdata
  rustfs_data:
    name: sms_rustfs_data
