
services:
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
    volumes:
      - sms_pgdata:/var/lib/postgresql/data
    networks:
      - sms
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: sms-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    command: /data
    volumes:
      - sms_rustfs_data:/data
    # Console is accessible only from the EC2 host.
    # Do not expose the console publicly.
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - sms
    healthcheck:
      test:
        - CMD
        - sh
        - -ec
        - >-
          curl -fsS http://127.0.0.1:9000/health &&
          curl -fsS http://127.0.0.1:9001/rustfs/console/health
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 40s

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/legacy-nightmare/sms-backend:stg}
    container_name: sms-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSL: "false"
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      S3_BUCKET: ${STORAGE_BUCKET:-sms-uploads}
      STORAGE_PUBLIC_URL_BASE: ${STORAGE_PUBLIC_URL_BASE:-}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      - sms_uploads:/app/uploads
    networks:
      - sms

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/legacy-nightmare/sms-frontend:stg}
    container_name: sms-frontend
    restart: unless-stopped
    networks:
      - sms

  nginx:
    image: nginx:1.27-alpine
    container_name: sms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - rustfs
    networks:
      - sms

networks:
  sms:
    driver: bridge

volumes:
  sms_pgdata:
  sms_uploads:
  sms_rustfs_data:
